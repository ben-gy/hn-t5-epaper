; LilyGo T5 E-Paper S3 Pro — Hacker News reader
[platformio]
boards_dir   = boards
default_envs = t5pro

[env:t5pro]
platform     = espressif32@6.12.0
framework    = arduino
board        = T5-ePaper-S3-Pro

upload_speed  = 921600
monitor_speed = 115200
monitor_filters = default, esp32_exception_decoder

board_build.partitions = partitions.csv
board_build.filesystem = littlefs

build_flags =
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DCORE_DEBUG_LEVEL=1
	-DDISABLE_ALL_LIBRARY_WARNINGS
	-std=gnu++17
build_unflags = -std=gnu++11

lib_deps =
	bblanchon/ArduinoJson@^7.4.2

; bring-up probe: same display/touch code, a test pattern instead of the app
[env:probe]
extends = env:t5pro
build_flags = ${env:t5pro.build_flags} -DPROBE
build_src_filter = +<*> -<ui.cpp> -<hn.cpp> -<reader.cpp> -<store.cpp> -<net.cpp> -<http.cpp> -<button.cpp> -<text.cpp>
